[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "triage"
version = "0.1.0"
description = "ServiceNow-stílusú ticket-triázs: LLM-tanár címkéi + Ettin-17M diák (CPU)"
requires-python = ">=3.12,<3.13"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = [
    "integration: end-to-end smoke teszt (modellletöltéssel)",
]
